<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login | ASSGA</title><link rel="stylesheet" href="assets/styles.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"></head><body><main class="hero"><div class="container" style="max-width:520px"><div class="form"><div class="section-title"><div class="brand-mark" style="margin:auto"><i class="fa-solid fa-lock"></i></div><h2>Login administrativo</h2><p>Entre no Management ASSGA.</p></div><form id="f" class="grid2"><div class="field full"><label>Usuário</label><input id="u" required></div><div class="field full"><label>Senha</label><input id="s" type="password" required></div><div class="field full"><button class="btn btn-primary" type="submit"><i class="fa-solid fa-right-to-bracket"></i> Entrar</button></div></form><div id="m" class="notice" style="display:none"></div><a class="btn btn-light" href="index.html">Voltar</a></div></div></main><script>f.onsubmit=e=>{e.preventDefault();let a=JSON.parse(localStorage.assgaAdmins||"[]"),ok=a.find(x=>x.usuario===u.value.trim()&&x.senha===s.value);if(ok){localStorage.assgaAdminAuth="1";location="management.html"}else{m.style.display="block";m.textContent="Usuário ou senha inválidos."}}</script></body></html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASSGA - Login Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="assets/styles.css">
    <style>
        .login-page { display:flex; justify-content:center; align-items:center; min-height:100vh; background:linear-gradient(135deg, var(--azul), var(--azul-escuro)); padding:20px; }
        .login-card { background:var(--branco); padding:40px 35px; border-radius:var(--radius); box-shadow:0 20px 60px rgba(0,0,0,0.3); width:100%; max-width:400px; text-align:center; border-top:6px solid var(--dourado); }
        .login-card .logo { font-size:2.8rem; font-weight:700; color:var(--azul); }
        .login-card .logo span { color:var(--dourado); }
        .login-card .sub { color:#64748b; margin-bottom:28px; font-size:0.95rem; }
        .login-card .input-group { position:relative; margin-bottom:20px; text-align:left; }
        .login-card .input-group i { position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--azul); opacity:0.6; }
        .login-card .input-group input { width:100%; padding:14px 14px 14px 44px; border:2px solid #e2e8f0; border-radius:8px; font-size:1rem; transition:var(--transition); background:#f8fafc; }
        .login-card .input-group input:focus { border-color:var(--dourado); outline:none; box-shadow:0 0 0 4px rgba(212,160,23,0.15); }
        .login-card .btn-login { width:100%; padding:14px; background:var(--azul); color:var(--branco); border:none; border-radius:8px; font-size:1.1rem; font-weight:600; cursor:pointer; transition:var(--transition); display:flex; align-items:center; justify-content:center; gap:10px; }
        .login-card .btn-login:hover { background:var(--azul-escuro); transform:translateY(-2px); box-shadow:0 8px 25px rgba(0,51,102,0.3); }
        .login-error { color:#dc2626; font-size:0.9rem; margin-top:10px; display:none; }
        .login-card .register-link { margin-top:18px; font-size:0.9rem; color:#475569; }
        .login-card .register-link a { color:var(--azul); font-weight:600; text-decoration:none; }
        .login-card .register-link a:hover { text-decoration:underline; }
    </style>
</head>
<body>
    <div class="login-page">
        <div class="login-card">
            <div class="logo">ASSGA<span>.</span></div>
            <div class="sub">Área Administrativa</div>
            <form id="loginForm">
                <div class="input-group"><i class="fas fa-user"></i><input type="text" id="loginUser" placeholder="Usuário" value="admin" required></div>
                <div class="input-group"><i class="fas fa-lock"></i><input type="password" id="loginPass" placeholder="Senha" value="123456" required></div>
                <button type="submit" class="btn-login"><i class="fas fa-sign-in-alt"></i> Entrar</button>
                <div class="login-error" id="loginError">Usuário ou senha inválidos!</div>
            </form>
            <div class="register-link">Não tem acesso? <a href="admin-cadastro.html">Cadastrar administrador</a></div>
        </div>
    </div>
    <script>
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const user = document.getElementById('loginUser').value.trim();
            const pass = document.getElementById('loginPass').value.trim();
            const admins = JSON.parse(localStorage.getItem('assga_admins') || '[]');
            const found = admins.find(a => a.usuario === user && a.senha === pass);
            if (found) {
                localStorage.setItem('assga_session', JSON.stringify({ userId: found.id, nome: found.nome, usuario: found.usuario }));
                window.location.href = 'management.html';
            } else {
                document.getElementById('loginError').style.display = 'block';
            }
        });
    </script>
</body>
</html>

<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login ASSGA</title><link rel="stylesheet" href="assets/styles.css"></head><body><main class="container" style="max-width:480px;margin-top:70px"><section class="panel"><h2>🔐 Login administrativo</h2><form id="f"><p>Usuário</p><input id="u" required><p>Senha</p><input id="s" type="password" required><br><br><button class="btn gold">Entrar</button></form><p id="m"></p><br><a href="admin-cadastro.html">Cadastro inicial</a></section></main><script>f.onsubmit=async e=>{e.preventDefault();let d=await fetch("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({usuario:u.value,senha:s.value})}).then(r=>r.json());if(d.token){localStorage.setItem("assga_token",d.token);location.href="management.html"}else m.textContent=d.erro||"Erro"}</script></body></html>

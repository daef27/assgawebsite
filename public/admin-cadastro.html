<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cadastro Admin - ASSGA</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"><link rel="stylesheet" href="styles.css"></head><body><main class="container" style="max-width:480px;margin-top:70px"><section class="panel"><h2><i class="fas fa-user-plus"></i> Cadastrar administrador</h2><br><form id="form"><label>Nome<input id="nome" required></label><br><label>Usuário<input id="usuario" required></label><br><label>Senha<input id="senha" type="password" minlength="6" required></label><br><button class="btn gold">Cadastrar</button></form><p id="msg" style="margin-top:15px"></p></section></main><script>form.onsubmit=async e=>{e.preventDefault();try{let d=await fetch("/api/admin/cadastro",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({nome:nome.value,usuario:usuario.value,senha:senha.value})}).then(r=>r.json());if(!d.ok)throw Error(d.erro);msg.textContent="Administrador criado! Redirecionando...";setTimeout(()=>location.href="admin-login.html",800)}catch(x){msg.textContent=x.message}}</script></body></html>

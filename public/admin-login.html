<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login Admin - ASSGA</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"><link rel="stylesheet" href="styles.css"></head><body><main class="container" style="max-width:480px;margin-top:70px"><section class="panel"><h2><i class="fas fa-user-shield"></i> Login administrativo</h2><br><form id="form"><label>Usuário<input id="usuario" required></label><br><label>Senha<input id="senha" type="password" required></label><br><button class="btn gold">Entrar</button></form><p id="msg" style="margin-top:15px"></p><br><a href="admin-cadastro.html">Cadastrar administrador</a></section></main><script>form.onsubmit=async e=>{e.preventDefault();try{let d=await fetch("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({usuario:usuario.value,senha:senha.value})}).then(r=>r.json());if(!d.token)throw Error(d.erro);localStorage.setItem("assga_token",d.token);location.href="management.html"}catch(x){msg.textContent=x.message}}</script></body></html>

<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel ASSGA</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"><link rel="stylesheet" href="styles.css"><style>
.admin{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.side{background:#002b55;color:#fff;padding:20px;position:sticky;top:0;height:100vh}.side button{display:block;width:100%;padding:12px;border:0;background:none;color:#fff;text-align:left;border-radius:8px;font-weight:700;margin:3px 0;cursor:pointer}.side button:hover,.side button.active{background:#0057b8}.content{padding:30px}.page{display:none}.page.active{display:block}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.admincard{background:#fff;padding:20px;border-radius:15px;border-top:4px solid #0057b8}.num{font-size:30px;font-weight:900;color:#0057b8}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.full{grid-column:1/-1}input,textarea,select{width:100%;padding:11px;border:1px solid #ccd6e0;border-radius:8px;box-sizing:border-box}textarea{min-height:130px}.actions{margin-top:15px;display:flex;gap:8px;flex-wrap:wrap}.danger{background:#dc3545;color:#fff}.success{background:#198754;color:#fff}.table{overflow:auto}table{width:100%;border-collapse:collapse;min-width:750px}th{background:#003366;color:#fff;text-align:left;padding:10px}td{padding:10px;border-bottom:1px solid #ddd}@media(max-width:850px){.admin{grid-template-columns:65px 1fr}.side span{display:none}.side{padding:10px}.side button{text-align:center}.cards{grid-template-columns:1fr 1fr}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}}@media(max-width:550px){.cards{grid-template-columns:1fr}.content{padding:15px}}
</style></head><body><div class="admin"><aside class="side"><h2>🛡️ <span>ASSGA</span></h2><br><button class="active" onclick="go('dash',this)"><i class="fas fa-chart-line"></i><span> Dashboard</span></button><button onclick="go('conteudo',this)"><i class="fas fa-file-pen"></i><span> Conteúdos</span></button><button onclick="go('eventos',this)"><i class="fas fa-calendar"></i><span> Eventos</span></button><button onclick="go('admin',this)"><i class="fas fa-user"></i><span> Administrador</span></button><br><button onclick="sair()"><i class="fas fa-right-from-bracket"></i><span> Sair</span></button></aside><main class="content">
<section id="dash" class="page active"><h1>Dashboard</h1><div class="cards"><div class="admincard">Páginas<div class="num" id="nPag">6</div></div><div class="admincard">Eventos<div class="num" id="nEvt">0</div></div><div class="admincard">Administradores<div class="num" id="nAdm">0</div></div><div class="admincard">Conteúdos<div class="num" id="nCon">0</div></div></div></section>
<section id="conteudo" class="page"><h1>Conteúdos do site</h1><div class="panel"><h2>Home</h2><div class="formgrid"><label>Título<input id="i_titulo"></label><label>Data<input id="i_data"></label><label>Local<input id="i_local"></label><label>Vagas<input id="i_vagas"></label><label class="full">Texto<textarea id="i_texto"></textarea></label></div><div class="actions"><button class="btn success" onclick="salvar('index',{titulo:i_titulo.value,texto:i_texto.value,data:i_data.value,local:i_local.value,vagas:i_vagas.value})">Salvar Home</button></div></div>
<div class="panel"><h2>História</h2><label>Título<input id="h_titulo"></label><br><label>Texto<textarea id="h_texto"></textarea></label><div class="actions"><button class="btn success" onclick="salvar('historia',{titulo:h_titulo.value,texto:h_texto.value})">Salvar História</button></div></div>
<div class="panel"><h2>Esportiva</h2><div class="formgrid"><label>Título<input id="e_titulo"></label><label>Modalidade<input id="e_modalidade"></label><label class="full">Texto<textarea id="e_texto"></textarea></label></div><div class="actions"><button class="btn success" onclick="salvar('esportiva',{titulo:e_titulo.value,modalidade:e_modalidade.value,texto:e_texto.value})">Salvar Esportiva</button></div></div>
<div class="panel"><h2>Estatuto</h2><label>Título<input id="s_titulo"></label><br><label>Texto<textarea id="s_texto"></textarea></label><br><label>URL do PDF<input id="s_pdf"></label><div class="actions"><button class="btn success" onclick="salvar('estatuto',{titulo:s_titulo.value,texto:s_texto.value,pdf:s_pdf.value})">Salvar Estatuto</button></div></div>
<div class="panel"><h2>Diretoria</h2><div class="formgrid"><label>Presidente<input id="d_presidente"></label><label>Vice<input id="d_vice"></label><label>Secretário<input id="d_secretario"></label><label>Tesoureiro<input id="d_tesoureiro"></label><label class="full">Texto<textarea id="d_texto"></textarea></label></div><div class="actions"><button class="btn success" onclick="salvar('diretoria',{presidente:d_presidente.value,vice:d_vice.value,secretario:d_secretario.value,tesoureiro:d_tesoureiro.value,texto:d_texto.value})">Salvar Diretoria</button></div></div></section>
<section id="eventos" class="page"><h1>Eventos</h1><div class="panel"><h2>Novo evento</h2><div class="formgrid"><label>Nome<input id="ev_nome"></label><label>Data<input id="ev_data"></label><label>Local<input id="ev_local"></label><label>Vagas<input id="ev_vagas" type="number"></label><label>Valor<input id="ev_valor"></label><label>Status<select id="ev_status"><option>Inscrições abertas</option><option>Em breve</option><option>Encerrado</option></select></label><label class="full">Descrição<textarea id="ev_desc"></textarea></label></div><div class="actions"><button class="btn success" onclick="criarEvento()">Cadastrar evento</button></div></div><div class="panel"><div class="table"><table><thead><tr><th>ID</th><th>Nome</th><th>Data</th><th>Status</th><th>Ação</th></tr></thead><tbody id="lista"></tbody></table></div></div></section>
<section id="admin" class="page"><h1>Administrador</h1><div class="panel"><p id="adminInfo">Carregando...</p><p>O cadastro de novos administradores fica em <a href="admin-cadastro.html">admin-cadastro.html</a>.</p></div></section>
</main></div><script>
const token=localStorage.getItem("assga_token");if(!token)location.href="admin-login.html";
const H={"Content-Type":"application/json","Authorization":"Bearer "+token};
async function api(u,o={}){o.headers={...(o.headers||{}),...H};let r=await fetch(u,o),d=await r.json();if(r.status===401){localStorage.removeItem("assga_token");location.href="admin-login.html"}if(!r.ok)throw Error(d.erro||"Erro");return d}
function go(id,btn){document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));document.getElementById(id).classList.add("active");document.querySelectorAll(".side button").forEach(x=>x.classList.remove("active"));btn.classList.add("active");if(id==="eventos")listarEventos()}
async function carregar(){let d=await api("/api/publico");const x=d.index;i_titulo.value=x.titulo;i_texto.value=x.texto;i_data.value=x.data;i_local.value=x.local;i_vagas.value=x.vagas;h_titulo.value=d.historia.titulo;h_texto.value=d.historia.texto;e_titulo.value=d.esportiva.titulo;e_modalidade.value=d.esportiva.modalidade;e_texto.value=d.esportiva.texto;s_titulo.value=d.estatuto.titulo;s_texto.value=d.estatuto.texto;s_pdf.value=d.estatuto.pdf||"";d_presidente.value=d.diretoria.presidente;d_vice.value=d.diretoria.vice;d_secretario.value=d.diretoria.secretario;d_tesoureiro.value=d.diretoria.tesoureiro;d_texto.value=d.diretoria.texto;listarEventos();let m=await api("/api/admin/me");adminInfo.textContent="Logado como: "+m.nome+" ("+m.usuario+")";let q=await api("/api/admin/dashboard");nEvt.textContent=q.eventos;nAdm.textContent=q.administradores;nCon.textContent=q.atualizacoes}
async function salvar(k,d){await api("/api/admin/conteudo/"+k,{method:"PUT",body:JSON.stringify(d)});alert("Salvo! O site público já está atualizado.")}
async function criarEvento(){await api("/api/admin/eventos",{method:"POST",body:JSON.stringify({nome:ev_nome.value,data:ev_data.value,local:ev_local.value,vagas:ev_vagas.value,valor:ev_valor.value,status:ev_status.value,descricao:ev_desc.value})});["ev_nome","ev_data","ev_local","ev_vagas","ev_valor","ev_desc"].forEach(x=>document.getElementById(x).value="");listarEventos();alert("Evento cadastrado!")}
async function listarEventos(){let d=await api("/api/publico");lista.innerHTML=d.eventos.map(e=>`<tr><td>${e.id}</td><td>${e.nome}</td><td>${e.data||""}</td><td>${e.status||""}</td><td><button class="btn danger" onclick="excluir(${e.id})">Excluir</button></td></tr>`).join("")}
async function excluir(id){if(!confirm("Excluir evento?"))return;await api("/api/admin/eventos/"+id,{method:"DELETE"});listarEventos()}
function sair(){localStorage.removeItem("assga_token");location.href="admin-login.html"}carregar();
</script></body></html>

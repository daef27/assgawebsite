<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASSGA - Eventos</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
    <header class="header">
        <div class="brand"><i class="fas fa-shield-alt"></i> ASSGA<span>.</span></div>
        <button class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></button>
        <nav class="nav-menu" id="navMenu">
            <a href="index.html"><i class="fas fa-home"></i> Início</a>
            <a href="historia.html"><i class="fas fa-book"></i> História</a>
            <a href="esportiva.html"><i class="fas fa-futbol"></i> Esportiva</a>
            <a href="evento.html" class="active"><i class="fas fa-calendar-alt"></i> Eventos</a>
            <a href="estatuto.html"><i class="fas fa-file-alt"></i> Estatuto</a>
            <a href="diretoria.html"><i class="fas fa-users"></i> Diretoria</a>
            <a href="admin-login.html"><i class="fas fa-lock"></i> Admin</a>
        </nav>
    </header>

    <main class="main-content">
        <h1 class="page-title"><i class="fas fa-calendar-alt"></i> Eventos</h1>
        <div class="page-subtitle">Confira a agenda da ASSGA</div>
        <div class="publish-grid" id="publicEvents">
            <div style="grid-column:1/-1;text-align:center;color:#94a3b8;padding:40px 0;">
                <i class="fas fa-inbox" style="font-size:2rem;display:block;margin-bottom:10px;"></i>
                Carregando eventos...
            </div>
        </div>
    </main>

    <footer class="footer">&copy; 2026 ASSGA</footer>
    <script src="assets/site.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const eventos = JSON.parse(localStorage.getItem('assga_eventos') || '[]')
                .filter(e => e.status === 'publicado');
            const container = document.getElementById('publicEvents');
            if (eventos.length === 0) {
                container.innerHTML = `<div style="grid-column:1/-1;text-align:center;color:#94a3b8;padding:40px 0;">
                    <i class="fas fa-inbox" style="font-size:2rem;display:block;margin-bottom:10px;"></i>
                    Nenhum evento publicado no momento.
                </div>`;
            } else {
                container.innerHTML = eventos.map(e => `
                    <div class="publish-card">
                        <div class="titulo">${e.titulo}</div>
                        <div class="meta">
                            <span><i class="fas fa-calendar-alt"></i> ${e.data ? e.data.split('-').reverse().join('/') : ''}</span>
                            <span><i class="fas fa-tag"></i> Publicado</span>
                        </div>
                        <div class="desc">${e.descricao || 'Sem descrição'}</div>
                        <span class="badge publicado">Publicado</span>
                    </div>
                `).join('');
            }
        });
    </script>
</body>
</html>

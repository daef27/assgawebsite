<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Management - ASSGA</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"><link rel="stylesheet" href="adminpainel.css"></head><body><header class="top"><b>🛡️ ASSGA ADMIN</b><button onclick="sairPainel()">Sair</button></header><aside class="sidebar"><button class="nav active" data-page="dashboard"><i class="fas fa-chart-line"></i><span> Dashboard</span></button><button class="nav " data-page="index"><i class="fas fa-house"></i><span> Home</span></button><button class="nav " data-page="historia"><i class="fas fa-book"></i><span> História</span></button><button class="nav " data-page="esportiva"><i class="fas fa-futbol"></i><span> Esportiva</span></button><button class="nav " data-page="evento"><i class="fas fa-calendar"></i><span> Eventos</span></button><button class="nav " data-page="estatuto"><i class="fas fa-file"></i><span> Estatuto</span></button><button class="nav " data-page="diretoria"><i class="fas fa-users"></i><span> Diretoria</span></button></aside><main class="main">
<section id="page-dashboard" class="page active"><h1>Dashboard</h1><div class="cards"><div class="card">Páginas<div class="num">6</div></div><div class="card">Eventos<div class="num">1</div></div><div class="card">Fotos<div class="num">0</div></div><div class="card">Registros<div class="num">0</div></div></div></section>
<section id="page-index" class="page"><h1>Home</h1><div class="panel"><div class="form"><label>Título<input id="titulo" value="2º HALLOWEEN ASSGA"></label><label>Data<input id="data" value="28 e 29 de novembro de 2026"></label><label>Local<input id="local" value="Em breve"></label><label>Vagas<input id="vagas" value="100"></label><label class="full">Texto<textarea id="texto">Estão abertas as inscrições para o 2º HALLOWEEN ASSGA!</textarea></label></div><br><button class="btn success" onclick="salvarIndex()">Salvar</button></div></section>
<section id="page-historia" class="page"><h1>História</h1><div class="panel"><label>Título<input id="historiaTitulo" value="Sobre a ASSGA"></label><br><label>Texto<textarea id="historiaTexto">A ASSGA promove esporte, integração social e fortalecimento da comunidade.</textarea></label><br><button class="btn success" onclick="salvarHistoria()">Salvar</button></div></section>
<section id="page-esportiva" class="page"><h1>Esportiva</h1><div class="panel"><div class="form"><label>Título<input id="esportivaTitulo" value="ASSGA Esportiva"></label><label>Modalidade<input id="esportivaModalidade" value="Futsal"></label><label class="full">Texto<textarea id="esportivaTexto">A ASSGA promove atividades esportivas e participação da comunidade.</textarea></label></div><br><button class="btn success" onclick="salvarEsportiva()">Salvar</button></div></section>
<section id="page-evento" class="page"><h1>Eventos</h1><div class="panel"><div class="form"><label>Nome<input id="eventoNome" value="2º HALLOWEEN ASSGA"></label><label>Data<input id="eventoData" value="28 e 29 de novembro de 2026"></label><label>Local<input id="eventoLocal" value="Em breve"></label><label>Vagas<input id="eventoVagas" value="100"></label><label>Valor<input id="eventoValor" value="R$ 100,00"></label><label>Status<select id="eventoStatus"><option>Inscrições abertas</option><option>Em breve</option><option>Encerrado</option></select></label><label class="full">Descrição<textarea id="eventoDescricao">Prepare-se para um evento especial.</textarea></label></div><br><button class="btn success" onclick="salvarEvento()">Salvar</button></div></section>
<section id="page-estatuto" class="page"><h1>Estatuto</h1><div class="panel"><label>Título<input id="estatutoTitulo" value="Estatuto Social da ASSGA"></label><br><label>Texto<textarea id="estatutoTexto">Documento oficial para consulta pública.</textarea></label><br><label>PDF<input id="estatutoPdf"></label><br><button class="btn success" onclick="salvarEstatuto()">Salvar</button></div></section>
<section id="page-diretoria" class="page"><h1>Diretoria</h1><div class="panel"><div class="form"><label>Presidente<input id="presidente"></label><label>Vice<input id="vice"></label><label>Secretário<input id="secretario"></label><label>Tesoureiro<input id="tesoureiro"></label><label class="full">Texto<textarea id="diretoriaTexto">Diretoria responsável pela organização da ASSGA.</textarea></label></div><br><button class="btn success" onclick="salvarDiretoria()">Salvar</button></div></section>
</main><script src="adminpainel.js"></script></body></html>

<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel ASSGA</title><link rel="stylesheet" href="assets/styles.css"><style>.adm{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.side{background:#002b55;color:white;padding:20px}.side button{display:block;width:100%;padding:12px;margin:4px 0;background:transparent;color:white;border:0;text-align:left;border-radius:8px;cursor:pointer}.side button:hover{background:#0057b8}.main{padding:25px}.page{display:none}.active{display:block}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.box{background:white;padding:20px;border-radius:15px;border-top:4px solid #0057b8}.num{font-size:30px;font-weight:900;color:#0057b8}input,textarea,select{width:100%;padding:10px;margin:5px 0;border:1px solid #ccd6e0;border-radius:8px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}table{width:100%;border-collapse:collapse;background:white}th,td{padding:10px;border-bottom:1px solid #ddd;text-align:left}th{background:#003366;color:white}@media(max-width:800px){.adm{grid-template-columns:65px 1fr}.side span{display:none}.cards{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}.full{grid-column:auto}}@media(max-width:500px){.cards{grid-template-columns:1fr}}</style></head><body><div class="adm"><aside class="side"><h2>🛡️ <span>ASSGA</span></h2><button onclick="go('dash')">📊 <span>Dashboard</span></button><button onclick="go('cont')">📝 <span>Conteúdos</span></button><button onclick="go('evt')">📅 <span>Eventos</span></button><button onclick="go('adm')">👤 <span>Administrador</span></button><button onclick="logout()">🚪 <span>Sair</span></button></aside><main class="main"><section id="dash" class="page active"><h1>Dashboard</h1><div class="cards"><div class="box">Páginas<div class="num">6</div></div><div class="box">Eventos<div class="num" id="ne">0</div></div><div class="box">Administradores<div class="num" id="na">0</div></div><div class="box">Atualizações<div class="num" id="nc">0</div></div></div></section><section id="cont" class="page"><h1>Conteúdos</h1><div class="box"><h2>Home</h2><div class="grid2"><input id="it" placeholder="Título"><input id="id" placeholder="Data"><input id="il" placeholder="Local"><input id="iv" placeholder="Vagas"><textarea id="ix" class="full" placeholder="Texto"></textarea></div><button class="btn gold" onclick="save('index',{titulo:it.value,texto:ix.value,data:id.value,local:il.value,vagas:iv.value})">Salvar Home</button></div><div class="box"><h2>História</h2><input id="ht"><textarea id="hx"></textarea><button class="btn gold" onclick="save('historia',{titulo:ht.value,texto:hx.value})">Salvar</button></div><div class="box"><h2>Esportiva</h2><input id="et"><input id="em"><textarea id="ex"></textarea><button class="btn gold" onclick="save('esportiva',{titulo:et.value,modalidade:em.value,texto:ex.value})">Salvar</button></div><div class="box"><h2>Estatuto</h2><input id="st"><textarea id="sx"></textarea><input id="sp" placeholder="URL do PDF"><button class="btn gold" onclick="save('estatuto',{titulo:st.value,texto:sx.value,pdf:sp.value})">Salvar</button></div><div class="box"><h2>Diretoria</h2><div class="grid2"><input id="dp" placeholder="Presidente"><input id="dv" placeholder="Vice"><input id="ds" placeholder="Secretário"><input id="dt" placeholder="Tesoureiro"><textarea id="dx" class="full"></textarea></div><button class="btn gold" onclick="save('diretoria',{presidente:dp.value,vice:dv.value,secretario:ds.value,tesoureiro:dt.value,texto:dx.value})">Salvar</button></div></section><section id="evt" class="page"><h1>Eventos</h1><div class="box"><div class="grid2"><input id="en" placeholder="Nome"><input id="ed" placeholder="Data"><input id="el" placeholder="Local"><input id="ev" type="number" placeholder="Vagas"><input id="er" placeholder="Valor"><select id="es"><option>Inscrições abertas</option><option>Em breve</option><option>Encerrado</option></select><textarea id="exx" class="full" placeholder="Descrição"></textarea></div><button class="btn gold" onclick="newEvent()">Cadastrar</button></div><div class="box"><table><thead><tr><th>Nome</th><th>Data</th><th>Status</th><th></th></tr></thead><tbody id="list"></tbody></table></div></section><section id="adm" class="page"><h1>Administrador</h1><div class="box" id="info"></div></section></main></div><script>
const T=localStorage.getItem("assga_token");if(!T)location.href="admin-login.html";const H={"Content-Type":"application/json","Authorization":"Bearer "+T},$=x=>document.getElementById(x);async function api(p,o={}){o.headers={...(o.headers||{}),...H};let r=await fetch("/api/"+p,o),d=await r.json();if(r.status===401){localStorage.removeItem("assga_token");location.href="admin-login.html"}if(!r.ok)throw Error(d.erro);return d}function go(x){document.querySelectorAll(".page").forEach(a=>a.classList.remove("active"));$(x).classList.add("active");if(x==="evt")events()}async function load(){let d=await api("publico"),i=d.index;it.value=i.titulo;ix.value=i.texto;id.value=i.data;il.value=i.local;iv.value=i.vagas;ht.value=d.historia.titulo;hx.value=d.historia.texto;et.value=d.esportiva.titulo;em.value=d.esportiva.modalidade;ex.value=d.esportiva.texto;st.value=d.estatuto.titulo;sx.value=d.estatuto.texto;sp.value=d.estatuto.pdf||"";dp.value=d.diretoria.presidente;dv.value=d.diretoria.vice;ds.value=d.diretoria.secretario;dt.value=d.diretoria.tesoureiro;dx.value=d.diretoria.texto;events();let m=await api("admin/me");info.textContent="Logado como "+m.nome+" ("+m.usuario+")";let q=await api("admin/dashboard");ne.textContent=q.eventos;na.textContent=q.administradores;nc.textContent=q.atualizacoes}async function save(k,d){await api("admin/conteudo/"+k,{method:"PUT",body:JSON.stringify(d)});alert("Publicado no site.")}async function newEvent(){await api("admin/eventos",{method:"POST",body:JSON.stringify({nome:en.value,data:ed.value,local:el.value,vagas:ev.value,valor:er.value,status:es.value,descricao:exx.value})});alert("Evento publicado.");events()}async function events(){let d=await api("publico");list.innerHTML=d.eventos.map(e=>`<tr><td>${e.nome}</td><td>${e.data}</td><td>${e.status}</td><td><button class="btn" onclick="del('${e.id}')">Excluir</button></td></tr>`).join("")}async function del(id){if(confirm("Excluir?")){await api("admin/eventos/"+id,{method:"DELETE"});events()}}function logout(){localStorage.removeItem("assga_token");location.href="admin-login.html"}load();
</script></body></html>

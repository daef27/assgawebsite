<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ASSGA Admin</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"><style>body{font-family:Segoe UI,Arial;background:#eef4fb;margin:0}.top{height:70px;background:linear-gradient(135deg,#003366,#0057b8);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 20px}.side{position:fixed;top:70px;bottom:0;width:220px;background:#002b55;padding:15px}.side button{display:block;width:100%;padding:12px;margin:4px 0;background:none;border:0;color:#fff;text-align:left;border-radius:8px;font-weight:700}.side button:hover,.side .active{background:#0057b8}.main{margin-left:250px;padding:95px 25px}.page{display:none}.page.active{display:block}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.card,.panel{background:#fff;border-radius:15px;padding:20px;margin-bottom:18px;box-shadow:0 8px 25px #0001}.card{border-top:4px solid #0057b8}.num{font-size:30px;font-weight:900;color:#0057b8}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field input,.field textarea{padding:12px;border:1px solid #ccd6e0;border-radius:8px}.field textarea{min-height:120px}.btn{padding:11px 16px;border:0;border-radius:8px;font-weight:800;cursor:pointer}.ok{background:#198754;color:#fff}.sec{background:#e9eef4;color:#003366}.danger{background:#dc3545;color:#fff}.actions{display:flex;gap:8px;margin-top:15px}.toast{position:fixed;bottom:20px;right:20px;background:#003366;color:#fff;padding:15px;border-radius:10px;opacity:0}.toast.show{opacity:1}table{width:100%;border-collapse:collapse}th{background:#003366;color:#fff;padding:10px}td{padding:10px;border-bottom:1px solid #ddd}@media(max-width:800px){.side{width:60px}.side span{display:none}.main{margin-left:70px}.cards{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.field.full{grid-column:auto}}</style></head><body><header class="top"><b><i class="fas fa-shield-halved"></i> ASSGA ADMIN</b><span id="nomeAdministrador">Administrador</span><button onclick="sairPainel()">Sair</button></header><aside class="side"><button class="nav-btn active" data-page="dashboard"><i class="fas fa-chart-line"></i> <span>Dashboard</span></button><button class="nav-btn" data-page="index"><i class="fas fa-home"></i> <span>Home</span></button><button class="nav-btn" data-page="historia"><i class="fas fa-book"></i> <span>História</span></button><button class="nav-btn" data-page="esportiva"><i class="fas fa-futbol"></i> <span>Esportiva</span></button><button class="nav-btn" data-page="evento"><i class="fas fa-calendar"></i> <span>Eventos</span></button><button class="nav-btn" data-page="estatuto"><i class="fas fa-file"></i> <span>Estatuto</span></button><button class="nav-btn" data-page="diretoria"><i class="fas fa-users"></i> <span>Diretoria</span></button><button class="nav-btn" data-page="registros"><i class="fas fa-list"></i> <span>Registros</span></button></aside><main class="main"><section id="page-dashboard" class="page active"><h1>Dashboard</h1><div class="cards"><div class="card">Páginas<div class="num">6</div></div><div class="card">Fotos<div id="totalFotos" class="num">0</div></div><div class="card">Eventos<div id="totalEventos" class="num">0</div></div><div class="card">Registros<div id="totalRegistros" class="num">0</div></div></div></section><section id="page-index" class="page"><h1>Home</h1><div class="panel"><div class="grid"><div class="field"><label>Título</label><input id=indexTitulo value='2º HALLOWEEN ASSGA'></div><div class="field"><label>Data</label><input id=indexData value=''></div><div class="field full"><label>Texto</label><textarea id=indexTexto>__TA__</textarea></div><div class="field"><label>Data evento</label><input id=indexEventoData value='28 e 29 de novembro de 2026'></div><div class="field"><label>Local</label><input id=indexLocal value='Em breve'></div><div class="field"><label>Vagas</label><input id=indexVagas value='100'></div><div class="field"><label>Valor</label><input id=indexPreco value='R$ 100,00'></div></div><div class="actions"><button class="btn ok" onclick="salvarIndex()">Salvar</button></div></div></section><section id="page-historia" class="page"><h1>História</h1><div class="panel"><div class="grid"><div class="field full"><label>Título</label><input id=historiaTitulo value='História da ASSGA'></div><div class="field full"><label>Conteúdo</label><textarea id=historiaTexto>__TA__</textarea></div></div><div class="actions"><button class="btn ok" onclick="salvarHistoria()">Salvar</button></div></div></section><section id="page-esportiva" class="page"><h1>Esportiva</h1><div class="panel"><div class="grid"><div class="field"><label>Título</label><input id=esportivaTitulo value='ASSGA Esportiva'></div><div class="field"><label>Modalidade</label><input id=esportivaModalidade value='Futsal'></div><div class="field full"><label>Descrição</label><textarea id=esportivaTexto>__TA__</textarea></div></div><div class="actions"><button class="btn ok" onclick="salvarEsportiva()">Salvar</button></div></div></section><section id="page-evento" class="page"><h1>Eventos</h1><div class="panel"><div class="grid"><div class="field"><label>Nome</label><input id=eventoNome value='2º HALLOWEEN ASSGA'></div><div class="field"><label>Data</label><input id=eventoData value='28 e 29 de novembro de 2026'></div><div class="field"><label>Local</label><input id=eventoLocal value='Em breve'></div><div class="field"><label>Vagas</label><input id=eventoVagas value='100'></div><div class="field"><label>Valor</label><input id=eventoValor value='R$ 100,00'></div><div class="field"><label>Status</label><input id=eventoStatus value='Inscrições abertas'></div><div class="field full"><label>Descrição</label><textarea id=eventoDescricao>__TA__</textarea></div></div><div class="actions"><button class="btn ok" onclick="salvarEvento()">Salvar</button></div></div></section><section id="page-estatuto" class="page"><h1>Estatuto</h1><div class="panel"><div class="grid"><div class="field full"><label>Título</label><input id=estatutoTitulo value='Estatuto Social da ASSGA'></div><div class="field full"><label>Texto</label><textarea id=estatutoTexto>__TA__</textarea></div><div class="field full"><label>PDF</label><input id=estatutoPdf value=''></div></div><div class="actions"><button class="btn ok" onclick="salvarEstatuto()">Salvar</button></div></div></section><section id="page-diretoria" class="page"><h1>Diretoria</h1><div class="panel"><div class="grid"><div class="field"><label>Presidente</label><input id=presidente value=''></div><div class="field"><label>Vice-presidente</label><input id=vicePresidente value=''></div><div class="field"><label>Secretário</label><input id=secretario value=''></div><div class="field"><label>Tesoureiro</label><input id=tesoureiro value=''></div><div class="field full"><label>Informações</label><textarea id=diretoriaTexto>__TA__</textarea></div></div><div class="actions"><button class="btn ok" onclick="salvarDiretoria()">Salvar</button></div></div></section><section id="page-registros" class="page"><h1>Registros</h1><div class="panel"><button class="btn danger" onclick="limparRegistros()">Limpar registros</button><table><thead><tr><th>#</th><th>Nome</th><th>CPF</th><th>Telefone</th><th>Data</th><th>Status</th></tr></thead><tbody id="tabelaRegistros"></tbody></table></div></section></main><div id="toast" class="toast"></div><script src="adminpainel.js"></script></body></html>

<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cadastro ASSGA</title><link rel="stylesheet" href="assets/styles.css"></head><body><main class="container" style="max-width:480px;margin-top:50px"><section class="panel"><h2>👤 Cadastro inicial</h2><p>Informe a chave ASSGA_SETUP_KEY configurada no Netlify.</p><form id="f"><input id="k" type="password" placeholder="Chave de configuração" required><input id="n" placeholder="Nome" required><input id="u" placeholder="Usuário" required><input id="s" type="password" minlength="6" placeholder="Senha" required><br><button class="btn gold">Cadastrar</button></form><p id="m"></p></section></main><script>f.onsubmit=async e=>{e.preventDefault();let d=await fetch("/api/admin/cadastro",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({chave:k.value,nome:n.value,usuario:u.value,senha:s.value})}).then(r=>r.json());m.textContent=d.ok?"Administrador criado. Faça login.":d.erro}</script></body></html>

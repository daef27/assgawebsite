<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASSGA - Cadastro Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="assets/styles.css">
    <style>
        .register-page { display:flex; justify-content:center; align-items:center; min-height:100vh; background:linear-gradient(135deg, var(--azul), var(--azul-escuro)); padding:20px; }
        .register-card { background:var(--branco); padding:40px 35px; border-radius:var(--radius); box-shadow:0 20px 60px rgba(0,0,0,0.3); width:100%; max-width:480px; border-top:6px solid var(--dourado); }
        .register-card .logo { font-size:2.8rem; font-weight:700; color:var(--azul); text-align:center; }
        .register-card .logo span { color:var(--dourado); }
        .register-card .sub { color:#64748b; text-align:center; margin-bottom:28px; font-size:0.95rem; }
        .register-card .form-group { margin-bottom:18px; }
        .register-card .form-group label { display:block; font-weight:600; margin-bottom:6px; color:#1e293b; font-size:0.9rem; }
        .register-card .form-group input { width:100%; padding:12px 16px; border:2px solid #e2e8f0; border-radius:8px; font-size:1rem; transition:var(--transition); background:#f8fafc; }
        .register-card .form-group input:focus { border-color:var(--dourado); outline:none; box-shadow:0 0 0 4px rgba(212,160,23,0.12); }
        .register-card .btn-register { width:100%; padding:14px; background:var(--dourado); color:var(--branco); border:none; border-radius:8px; font-size:1.1rem; font-weight:600; cursor:pointer; transition:var(--transition); display:flex; align-items:center; justify-content:center; gap:10px; }
        .register-card .btn-register:hover { background:#b8890f; transform:translateY(-2px); }
        .register-card .login-link { text-align:center; margin-top:18px; font-size:0.9rem; color:#475569; }
        .register-card .login-link a { color:var(--azul); font-weight:600; text-decoration:none; }
        .register-card .login-link a:hover { text-decoration:underline; }
    </style>
</head>
<body>
    <div class="register-page">
        <div class="register-card">
            <div class="logo">ASSGA<span>.</span></div>
            <div class="sub">Cadastro de Administrador</div>
            <form id="adminRegisterForm">
                <div class="form-group"><label><i class="fas fa-user"></i> Nome</label><input type="text" id="adminNome" placeholder="Nome completo" required></div>
                <div class="form-group"><label><i class="fas fa-envelope"></i> E-mail</label><input type="email" id="adminEmail" placeholder="email@exemplo.com" required></div>
                <div class="form-group"><label><i class="fas fa-user-tag"></i> Usuário</label><input type="text" id="adminUser" placeholder="nome_usuario" required></div>
                <div class="form-group"><label><i class="fas fa-lock"></i> Senha</label><input type="password" id="adminPass" placeholder="Mínimo 6 caracteres" required minlength="6"></div>
                <button type="submit" class="btn-register"><i class="fas fa-user-plus"></i> Cadastrar</button>
            </form>
            <div class="login-link">Já tem cadastro? <a href="admin-login.html">Fazer login</a></div>
        </div>
    </div>
    <script>
        document.getElementById('adminRegisterForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const nome = document.getElementById('adminNome').value.trim();
            const email = document.getElementById('adminEmail').value.trim();
            const usuario = document.getElementById('adminUser').value.trim();
            const senha = document.getElementById('adminPass').value.trim();
            if (!nome || !email || !usuario || !senha || senha.length < 6) {
                alert('Preencha todos os campos (senha ≥ 6 caracteres).');
                return;
            }
            const admins = JSON.parse(localStorage.getItem('assga_admins') || '[]');
            if (admins.some(a => a.usuario === usuario)) {
                alert('Usuário já existe!');
                return;
            }
            admins.push({ id: Date.now(), nome, email, usuario, senha });
            localStorage.setItem('assga_admins', JSON.stringify(admins));
            alert('Administrador cadastrado com sucesso!');
            window.location.href = 'admin-login.html';
        });
    </script>
</body>
</html>

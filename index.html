<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASSGA - Início</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
    <header class="header">
        <div class="brand"><i class="fas fa-shield-alt"></i> ASSGA<span>.</span></div>
        <button class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></button>
        <nav class="nav-menu" id="navMenu">
            <a href="index.html" class="active"><i class="fas fa-home"></i> Início</a>
            <a href="historia.html"><i class="fas fa-book"></i> História</a>
            <a href="esportiva.html"><i class="fas fa-futbol"></i> Esportiva</a>
            <a href="evento.html"><i class="fas fa-calendar-alt"></i> Eventos</a>
            <a href="estatuto.html"><i class="fas fa-file-alt"></i> Estatuto</a>
            <a href="diretoria.html"><i class="fas fa-users"></i> Diretoria</a>
            <a href="admin-login.html"><i class="fas fa-lock"></i> Admin</a>
        </nav>
    </header>

    <main class="main-content">
        <h1 class="page-title"><i class="fas fa-home"></i> Bem-vindo à ASSGA</h1>
        <div class="page-subtitle">Associação Esportiva e Cultural</div>

        <div class="cards-grid">
            <div class="card"><i class="fas fa-trophy icon"></i><div class="number">10+</div><div class="label">Títulos</div></div>
            <div class="card verde"><i class="fas fa-users icon"></i><div class="number">200+</div><div class="label">Associados</div></div>
            <div class="card dourado"><i class="fas fa-calendar-check icon"></i><div class="number">30+</div><div class="label">Eventos</div></div>
            <div class="card roxo"><i class="fas fa-medal icon"></i><div class="number">5</div><div class="label">Modalidades</div></div>
        </div>

        <!-- SEÇÃO DE EVENTOS PUBLICADOS (integrada com o painel) -->
        <div style="background:var(--branco);border-radius:var(--radius);padding:24px;box-shadow:var(--sombra);margin-top:20px;">
            <h3 style="color:var(--azul);display:flex;gap:10px;margin-bottom:12px;">
                <i class="fas fa-calendar-alt" style="color:var(--dourado);"></i> Eventos Publicados
            </h3>
            <div class="publish-grid" id="publicEventsIndex">
                <div style="grid-column:1/-1;text-align:center;color:#94a3b8;padding:20px 0;">
                    <i class="fas fa-inbox" style="font-size:1.5rem;display:block;margin-bottom:6px;"></i>
                    Carregando eventos...
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">&copy; 2026 ASSGA - Associação Esportiva. Desenvolvido com <i class="fas fa-heart" style="color:var(--dourado);"></i></footer>
    <script src="assets/site.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const eventos = JSON.parse(localStorage.getItem('assga_eventos') || '[]')
                .filter(e => e.status === 'publicado');
            const container = document.getElementById('publicEventsIndex');
            if (eventos.length === 0) {
                container.innerHTML = `<div style="grid-column:1/-1;text-align:center;color:#94a3b8;padding:20px 0;">
                    <i class="fas fa-inbox" style="font-size:1.5rem;display:block;margin-bottom:6px;"></i>
                    Nenhum evento publicado no momento.
                </div>`;
            } else {
                container.innerHTML = eventos.map(e => `
                    <div class="publish-card">
                        <div class="titulo">${e.titulo}</div>
                        <div class="meta">
                            <span><i class="fas fa-calendar-alt"></i> ${e.data ? e.data.split('-').reverse().join('/') : ''}</span>
                            <span><i class="fas fa-tag"></i> Publicado</span>
                        </div>
                        <div class="desc">${e.descricao || 'Sem descrição'}</div>
                        <span class="badge publicado">Publicado</span>
                    </div>
                `).join('');
            }
        });
    </script>
</body>
</html>
